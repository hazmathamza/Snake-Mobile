<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Snake Mobile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }
  header { width: 100%; display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 22px; letter-spacing: 2px; }
  .scores { display: flex; gap: 8px; }
  .pill {
    background: #1e293b;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 600;
  }
  .pill span { color: #4ade80; }
  #board-wrap {
    position: relative;
    width: min(92vw, 54dvh, 440px);
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; background: #16213a; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(2px);
    text-align: center;
    cursor: pointer;
    padding: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay-title { font-size: 26px; font-weight: 800; }
  #overlay-sub { font-size: 15px; color: #cbd5e1; line-height: 1.4; }
  #overlay-score { font-size: 15px; color: #4ade80; font-weight: 700; }
  #overlay-cta {
    margin-top: 6px;
    background: #4ade80;
    color: #0f172a;
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
  }
  #controls { display: flex; gap: 10px; width: min(92vw, 54dvh, 440px); }
  .btn {
    flex: 1;
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active { background: #334155; }
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    touch-action: none;
  }
  .dpad-btn {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    color: #e2e8f0;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
  }
  .dpad-btn:active { background: #4ade80; color: #0f172a; }
  .dpad-empty { visibility: hidden; }
  #hint { font-size: 13px; color: #94a3b8; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>SNAKE</h1>
    <div class="scores">
      <div class="pill">Score <span id="score">0</span></div>
      <div class="pill">Best <span id="best">0</span></div>
    </div>
  </header>

  <div id="board-wrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <div id="overlay-title">Snake</div>
      <div id="overlay-sub">Eat the food, grow longer.<br>Don't hit the walls or yourself.</div>
      <div id="overlay-score"></div>
      <button id="overlay-cta" type="button">Tap to Start</button>
    </div>
  </div>

  <div id="controls">
    <button id="pause-btn" class="btn" type="button">Pause</button>
    <button id="restart-btn" class="btn" type="button">Restart</button>
  </div>

  <div id="dpad">
    <div class="dpad-empty"></div>
    <button class="dpad-btn" data-dir="up" type="button" aria-label="Up">&#9650;</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" data-dir="left" type="button" aria-label="Left">&#9664;</button>
    <button class="dpad-btn" data-dir="down" type="button" aria-label="Down">&#9660;</button>
    <button class="dpad-btn" data-dir="right" type="button" aria-label="Right">&#9654;</button>
    <div class="dpad-empty"></div>
    <div class="dpad-empty"></div>
    <div class="dpad-empty"></div>
  </div>

  <p id="hint">Swipe on the board, use the pad, or use arrow keys / WASD.</p>
</div>
</body>
</html>
