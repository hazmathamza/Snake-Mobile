<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Snake Mobile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }
  header { width: 100%; display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 22px; letter-spacing: 2px; }
  .scores { display: flex; gap: 8px; }
  .pill {
    background: #1e293b;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 600;
  }
  .pill span { color: #4ade80; }
  #board-wrap {
    position: relative;
    width: min(92vw, 54dvh, 440px);
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; background: #16213a; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(2px);
    text-align: center;
    cursor: pointer;
    padding: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay-title { font-size: 26px; font-weight: 800; }
  #overlay-sub { font-size: 15px; color: #cbd5e1; line-height: 1.4; }
  #overlay-score { font-size: 15px; color: #4ade80; font-weight: 700; }
  #overlay-cta {
    margin-top: 6px;
    background: #4ade80;
    color: #0f172a;
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
  }
  #controls { display: flex; gap: 10px; width: min(92vw, 54dvh, 440px); }
  .btn {
    flex: 1;
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active { background: #334155; }
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    touch-action: none;
  }
  .dpad-btn {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    color: #e2e8f0;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
  }
  .dpad-btn:active { background: #4ade80; color: #0f172a; }
  .dpad-empty { visibility: hidden; }
  #hint { font-size: 13px; color: #94a3b8; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>SNAKE</h1>
    <div class="scores">
      <div class="pill">Score <span id="score">0</span></div>
      <div class="pill">Best <span id="best">0</span></div>
    </div>
  </header>

  <div id="board-wrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <div id="overlay-title">Snake</div>
      <div id="overlay-sub">Eat the food, grow longer.<br>Don't hit the walls or yourself.</div>
      <div id="overlay-score"></div>
      <button id="overlay-cta" type="button">Tap to Start</button>
    </div>
  </div>

  <div id="controls">
    <button id="pause-btn" class="btn" type="button">Pause</button>
    <button id="restart-btn" class="btn" type="button">Restart</button>
  </div>

  <div id="dpad">
    <div class="dpad-empty"></div>
    <button class="dpad-btn" data-dir="up" type="button" aria-label="Up">&#9650;</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" data-dir="left" type="button" aria-label="Left">&#9664;</button>
    <button class="dpad-btn" data-dir="down" type="button" aria-label="Down">&#9660;</button>
    <button class="dpad-btn" data-dir="right" type="button" aria-label="Right">&#9654;</button>
    <div class="dpad-empty"></div>
    <div class="dpad-empty"></div>
    <div class="dpad-empty"></div>
  </div>

  <p id="hint">Swipe on the board, use the pad, or use arrow keys / WASD.</p>
</div>

<script>
(function () {
  "use strict";

  var GRID = 20;
  var START_SPEED = 160;
  var MIN_SPEED = 70;
  var SPEED_STEP = 3;

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("board-wrap");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlay-title");
  var overlaySub = document.getElementById("overlay-sub");
  var overlayScore = document.getElementById("overlay-score");
  var overlayCta = document.getElementById("overlay-cta");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var pauseBtn = document.getElementById("pause-btn");
  var restartBtn = document.getElementById("restart-btn");

  var snake, dir, dirQueue, food, score, best, speed, timer, running, over;
  var cell = 20;

  function loadBest() {
    try { best = parseInt(localStorage.getItem("snake-mobile-highscore"), 10) || 0; }
    catch (e) { best = 0; }
    bestEl.textContent = best;
  }

  function saveBest() {
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("snake-mobile-highscore", String(best)); } catch (e) { /* ignore */ }
    }
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ }
  }

  function resize() {
    var size = wrap.clientWidth;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / GRID;
    draw();
  }

  function placeFood() {
    while (true) {
      var f = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
      var clash = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
      if (!clash) { food = f; return; }
    }
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    dirQueue = [];
    score = 0;
    speed = START_SPEED;
    over = false;
    scoreEl.textContent = "0";
    placeFood();
    draw();
  }

  function setDir(x, y) {
    var last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (x === -last.x && y === -last.y) return; // no 180-degree turns
    if (x === last.x && y === last.y) return;
    if (dirQueue.length < 3) dirQueue.push({ x: x, y: y });
  }

  function tick() {
    if (dirQueue.length) dir = dirQueue.shift();
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) return gameOver();
    // Self collision (tail moves away unless growing, so ignore tail tip when not eating)
    var eating = head.x === food.x && head.y === food.y;
    var body = eating ? snake : snake.slice(0, -1);
    if (body.some(function (s) { return s.x === head.x && s.y === head.y; })) return gameOver();

    snake.unshift(head);
    if (eating) {
      score += 1;
      scoreEl.textContent = score;
      saveBest();
      vibrate(30);
      speed = Math.max(MIN_SPEED, START_SPEED - score * SPEED_STEP);
      restartTimer();
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function restartTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function start() {
    if (over || !snake) reset();
    if (running) return;
    running = true;
    overlay.classList.add("hidden");
    pauseBtn.textContent = "Pause";
    restartTimer();
  }

  function pause() {
    if (!running) return;
    running = false;
    if (timer) clearInterval(timer);
    pauseBtn.textContent = "Resume";
    showOverlay("Paused", "Take a breath. Tap below to keep going.", "");
    overlayCta.textContent = "Resume";
  }

  function resume() {
    if (over) { reset(); start(); return; }
    if (running) return;
    running = true;
    overlay.classList.add("hidden");
    pauseBtn.textContent = "Pause";
    restartTimer();
  }

  function gameOver() {
    running = false;
    over = true;
    if (timer) clearInterval(timer);
    vibrate([60, 40, 60]);
    saveBest();
    pauseBtn.textContent = "Pause";
    showOverlay("Game Over", "The snake crashed.", "Score: " + score + "  ·  Best: " + best);
    overlayCta.textContent = "Play Again";
  }

  function showOverlay(title, sub, scoreLine) {
    overlayTitle.textContent = title;
    overlaySub.textContent = sub;
    overlayScore.textContent = scoreLine;
    overlay.classList.remove("hidden");
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    var size = wrap.clientWidth;
    ctx.fillStyle = "#16213a";
    ctx.fillRect(0, 0, size, size);

    // Subtle checkerboard
    ctx.fillStyle = "#182645";
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        if ((x + y) % 2 === 0) ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }

    // Food with a gentle pulse
    var pulse = 1 + 0.12 * Math.sin(Date.now() / 180);
    var fx = food.x * cell + cell / 2;
    var fy = food.y * cell + cell / 2;
    var fr = (cell * 0.34) * pulse;
    ctx.beginPath();
    ctx.arc(fx, fy, fr + 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(244, 63, 94, 0.25)";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(fx, fy, fr, 0, Math.PI * 2);
    ctx.fillStyle = "#f43f5e";
    ctx.fill();

    // Snake
    snake.forEach(function (seg, i) {
      var px = seg.x * cell, py = seg.y * cell;
      var pad = i === 0 ? 1 : 2;
      ctx.fillStyle = i === 0 ? "#4ade80" : (i % 2 ? "#22c55e" : "#16a34a");
      roundRect(px + pad, py + pad, cell - pad * 2, cell - pad * 2, 6);
      ctx.fill();
    });

    // Eyes on the head
    var h = snake[0];
    var cx = h.x * cell + cell / 2, cy = h.y * cell + cell / 2;
    var ex = dir.x, ey = dir.y;
    var pxOff = -ey, pyOff = ex; // perpendicular
    var eyeDist = cell * 0.2, fwd = cell * 0.16, eyeR = cell * 0.11;
    [[1, 1], [1, -1]].forEach(function (s) {
      var exPos = cx + pxOff * eyeDist * s[1] + ex * fwd;
      var eyPos = cy + pyOff * eyeDist * s[1] + ey * fwd;
      ctx.beginPath();
      ctx.arc(exPos, eyPos, eyeR + 1.5, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(exPos + ex * 1.5, eyPos + ey * 1.5, eyeR * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = "#0f172a";
      ctx.fill();
    });
  }

  // --- Input: overlay / buttons ---
  overlay.addEventListener("click", function () {
    if (over) { reset(); start(); }
    else if (!running) { start(); }
    else { resume(); }
  });
  overlayCta.addEventListener("click", function (e) {
    e.stopPropagation();
    if (over) { reset(); start(); }
    else if (running) { pause(); }
    else { resume(); }
  });

  pauseBtn.addEventListener("click", function () {
    if (over) return;
    if (running) pause(); else resume();
  });
  restartBtn.addEventListener("click", function () {
    reset();
    start();
  });

  // --- Input: D-pad ---
  var DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };
  document.querySelectorAll(".dpad-btn").forEach(function (btn) {
    btn.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      var d = DIRS[btn.getAttribute("data-dir")];
      if (over) { reset(); start(); setDir(d.x, d.y); return; }
      if (!running) start();
      setDir(d.x, d.y);
    });
  });

  // --- Input: swipe on the board ---
  var touchX = 0, touchY = 0;
  wrap.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  wrap.addEventListener("touchmove", function (e) {
    if (e.cancelable) e.preventDefault(); // stop page scroll / pull-to-refresh
  }, { passive: false });
  wrap.addEventListener("touchend", function (e) {
    if (over || !running) return;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; // tap, not a swipe
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  // --- Input: keyboard (desktop) ---
  document.addEventListener("keydown", function (e) {
    var k = e.key;
    var map = {
      ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
      ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
      ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
      ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
    };
    if (map[k]) {
      e.preventDefault();
      if (over) { reset(); start(); }
      if (!running) start();
      setDir(map[k][0], map[k][1]);
    } else if (k === " " || k === "Enter") {
      e.preventDefault();
      if (over) { reset(); start(); }
      else if (running) pause();
      else resume();
    }
  });

  // Auto-pause when the tab/app goes to the background
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && running) pause();
  });

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () {
    setTimeout(resize, 100);
  });

  loadBest();
  reset();
  showOverlay("Snake", "Eat the food, grow longer.\nDon't hit the walls or yourself.", "");
  overlayCta.textContent = "Tap to Start";
  resize();
})();
</script>
</body>
</html>
